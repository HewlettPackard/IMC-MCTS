name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify the pinned scanner
        run: |
          scanner_dir="$RUNNER_TEMP/imc-mcts-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_SHA256" "$scanner_dir/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
      - name: Scan history with redacted findings
        run: '"$RUNNER_TEMP/imc-mcts-gitleaks/gitleaks" git --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --exit-code 1 --log-opts="--all" "$GITHUB_WORKSPACE"'
