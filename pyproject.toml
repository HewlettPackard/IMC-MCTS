[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imc-mcts"
version = "0.2.0rc1"
description = "Research simulator and interactive Studio for in-memory-compute MCTS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/**/*"]
maintainers = [{name = "Tergel Molom-Ochir", email = "tergel.molom-ochir@hpe.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
test = [] # Public tests use the Python standard library.
paper = [
    "matplotlib==3.10.6",
    "pandas==3.0.2",
    "scipy==1.17.0",
    "seaborn==0.13.2",
]
render = ["PyMuPDF==1.27.2.2"]

[project.scripts]
imc-mcts = "imc_mcts_release.cli:main"

[project.urls]
Repository = "https://github.com/HewlettPackard/IMC-MCTS"
Issues = "https://github.com/HewlettPackard/IMC-MCTS/issues"

[tool.setuptools]
package-dir = {"" = "source"}
py-modules = ["reproduce_runtime", "verify_runtime"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["source"]
namespaces = true
include = [
    "core", "core.*",
    "generalizability", "generalizability.*",
    "p03_experiments", "p03_experiments.*",
    "p04_results", "p04_results.*",
    "p05_studio", "p05_studio.*",
    "py_sst_cpp", "py_sst_cpp.*",
    "tournament", "tournament.*",
    "rtl_synthesis", "rtl_synthesis.*",
    "fixtures", "fixtures.*",
    "tests", "tests.*",
    "imc_mcts_release", "imc_mcts_release.*",
]
exclude = ["*.__pycache__", "*.build", "*.dist", "*.egg-info"]

[tool.setuptools.package-data]
"*" = ["*", "**/*"]

