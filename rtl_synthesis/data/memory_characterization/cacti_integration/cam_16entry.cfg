# Accelerator CAM Configuration  
# 16-entry Content Addressable Memory for node lookup cache

-size (bytes) 448
-block size (bytes) 28
-associativity 16
-read-write port 1
-exclusive read port 0
-exclusive write port 0
-single ended read ports 0
-search port 1

# Technology parameters
-technology (u) 0.028
-page size (bits) 8192

# CAM-specific settings - optimize for search speed
-Data array cell type - "itrs-hp"
-Data array peripheral type - "itrs-hp"
-Tag array cell type - "itrs-hp"  
-Tag array peripheral type - "itrs-hp"

# Optimization for ultra-low search latency
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 50:10:10:20:10
-deviate (delay, dynamic power, leakage power, cycle time, area) 20:100000:100000:100000:1000000
-Optimize ED or ED^2 (ED, ED^2, NONE): ED

# CAM requires fully associative lookup
-Cache model (NUCA, UCA)  - "UCA"

# Wire type for fast parallel search
-Wire inside mat - "global"
-Wire outside mat - "global"

# Output options
-print level (DETAILED, CONCISE) - DETAILED
-print input parameters - 1
