# Accelerator Instruction Memory Configuration
# 2KB ROM for FSM microcode storage

-size (bytes) 2048
-block size (bytes) 4
-associativity 1
-read-write port 0
-exclusive read port 1
-exclusive write port 0
-single ended read ports 0
-search port 0

# Technology parameters
-technology (u) 0.028
-page size (bits) 8192

# Access characteristics - sequential instruction fetch
-burst length 1
-internal prefetch width 8

# ROM-optimized settings for low power
-Data array cell type - "itrs-lop"
-Data array peripheral type - "itrs-lop"
-Tag array cell type - "itrs-lop"
-Tag array peripheral type - "itrs-lop"

# Optimization for low power (instructions accessed sequentially)
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 10:20:30:20:20
-deviate (delay, dynamic power, leakage power, cycle time, area) 100:100000:100000:100000:1000000
-Optimize ED or ED^2 (ED, ED^2, NONE): ED^2

# Simple direct-mapped organization
-Cache model (NUCA, UCA)  - "UCA"

# Wire type
-Wire inside mat - "local"
-Wire outside mat - "global"

# Output options
-print level (DETAILED, CONCISE) - DETAILED
-print input parameters - 1
